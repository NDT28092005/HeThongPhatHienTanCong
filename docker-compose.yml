services:
  mysql:
    image: mysql:8.0
    container_name: antoan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: backendboostea
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - antoan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antoan-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_KEY: base64:7RXwL89kLw5KAXLKJelgZs6sdZ441zJjVs2iGnkWTHE=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: backendboostea
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - antoan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8001/api
        VITE_GOOGLE_CLIENT_ID: 177981706881-3ptrkkc7bpam5ch4eokm9otdeu7f05f6.apps.googleusercontent.com
    container_name: antoan-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - antoan-network

  fastapi:
    build:
      context: ./Fastapi
      dockerfile: Dockerfile
    container_name: antoan-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - antoan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  antoan-network:
    driver: bridge

volumes:
  mysql_data:
